experiment:
  name: mnist_common_relaxation
  seed: 1337
  device: cuda
  strict_determinism: true
data:
  dataset: MNIST
  root: ./data
  batch_size: 128
  num_workers: 0
  shuffle: true
  normalize: true
  normalize_mean: [0.1307]
  normalize_std: [0.3081]
  augmentation: none
split:
  A_digits: [0, 1, 2, 3, 4]
  B_digits: [5, 6, 7, 8, 9]
model:
  arch: simple_cnn
  norm: none
  group_norm_groups: 8
  activation: relu
train:
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0
  epochs_total: 20
  phase_epochs: 10
  scenario: SBAC
  relaxation_optimizer_policy: preserve
  log_every_steps: 100
  relaxation_steps: 10000
  relaxation_samples_per_class: 5000
  relaxation_checkpoints: [0, 100, 500, 1000, 2500, 5000, 10000]
logging:
  save_dir: ./results
  run_name: mnist_common_relaxation_SBAC_seed1337_normnone
  save_weights_every_epoch: true
  overwrite: false
